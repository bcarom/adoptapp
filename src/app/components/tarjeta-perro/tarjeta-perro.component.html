<ion-card>
  <div class="card-image-container">
    <ion-img [src]="perro.foto" [alt]="perro.nombre"></ion-img>
    <ion-badge [color]="badgeColor" class="adoption-badge">
      {{ estadoAdopcion }}
    </ion-badge>
  </div>

  <ion-card-header>
    <ion-card-title>{{ perro.nombre }}</ion-card-title>
    <ion-card-subtitle>
      {{ perro.raza }} • {{ perro.edad }}
    </ion-card-subtitle>
  </ion-card-header>

  <ion-card-content>
    <div class="info-chips">
      <ion-chip [color]="perro.sexo === 'Macho' ? 'primary' : 'warning'" outline>
        {{ sexoIcono }} {{ perro.sexo }}
      </ion-chip>
      <ion-chip color="medium" outline>
        {{ perro.tamano }}
      </ion-chip>
      <ion-chip [color]="perro.vacunada ? 'success' : 'medium'" outline>
        {{ perro.vacunada ? '✓ Vacunado' : 'Sin vacunas' }}
      </ion-chip>
    </div>
  </ion-card-content>
</ion-card>
